services:
  postgres:
    image: postgres:16
    container_name: retropick-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: retropick
      POSTGRES_PASSWORD: retropick
      POSTGRES_DB: retropick
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: retropick-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: retropick-api
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://retropick:retropick@postgres:5432/retropick
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: retropick-worker
    restart: unless-stopped
    depends_on:
      - redis
      - api
    environment:
      API_URL: http://api:3001
      REDIS_URL: redis://redis:6379

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: retropick-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres_data:
  redis_data:
