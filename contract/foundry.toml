[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
fs_permissions = [{ access = "read", path = "out" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "@openzeppelin/=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
  "@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
  "openzeppelin-foundry-upgrades/=lib/openzeppelin-foundry-upgrades/src/",
]

# Use: `FOUNDRY_PROFILE=production forge build` — overrides only listed keys vs `[profile.default]`.
[profile.production]
optimizer_runs = 1_000_000

[profile.deploybudget]
optimizer_runs = 1
bytecode_hash = "none"
cbor_metadata = false

[profile.ci]
fuzz = { runs = 256 }

# Forge linter: allow OpenZeppelin UUPS gap name; skip style-only suggestions that fight bytecode/size goals.
[lint]
mixed_case_exceptions = ["ERC", "URI", "__gap"]
exclude_lints = ["unwrapped-modifier-logic", "asm-keccak256"]
